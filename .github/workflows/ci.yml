# Runs on every push to a pull request (and on main itself). Each job is its
# own status check, so branch protection can require "Types" alone or all three.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run still going for the old commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc -b --noEmit
        run: npx tsc -b --noEmit

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      # ffmpeg/ffprobe: the thumbnail tests use them when present and skip
      # otherwise - installing them keeps CI as strict as the server.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # Not a gate: measures both suites and keeps one comment on the PR up to
  # date with the figures (edited in place on every push, never a new one).
  coverage:
    name: Coverage
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Backend coverage
        run: python -m pytest -q --cov=backend --cov-report=json:coverage-backend.json --cov-report=term
      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save @vitest/coverage-v8@5
          npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=json-summary --coverage.reporter=text --coverage.include='src/**/*.ts' --coverage.include='src/**/*.tsx' --coverage.exclude='src/**/*.test.*' --coverage.exclude='src/test/**'
      - name: Comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- downlee-coverage -->';
            const pct = (n) => `${Number(n).toFixed(1)}%`;

            const be = JSON.parse(fs.readFileSync('coverage-backend.json', 'utf8'));
            const beTotal = be.totals.percent_covered;
            const beLowest = Object.entries(be.files)
              .map(([file, f]) => [file, f.summary.percent_covered, f.summary.num_statements])
              .filter(([, , n]) => n >= 40)
              .sort((a, b) => a[1] - b[1]).slice(0, 5);

            const fe = JSON.parse(fs.readFileSync('frontend/coverage/coverage-summary.json', 'utf8'));
            const t = fe.total;
            const feLowest = Object.entries(fe)
              .filter(([k, v]) => k !== 'total' && v.statements.total >= 40)
              .map(([file, v]) => [file.replace(/^.*\/frontend\//, ''), v.statements.pct, v.statements.total])
              .sort((a, b) => a[1] - b[1]).slice(0, 5);

            const rows = (list) => list.map(([f, p, n]) => `| \`${f}\` | ${pct(p)} | ${n} |`).join('\n');
            const body = `${marker}
            ## Coverage

            | Suite | Statements | Branches | Functions | Lines |
            |---|---|---|---|---|
            | Backend (pytest) | **${pct(beTotal)}** | – | – | – |
            | Frontend (vitest) | **${pct(t.statements.pct)}** | ${pct(t.branches.pct)} | ${pct(t.functions.pct)} | ${pct(t.lines.pct)} |

            <details><summary>Least-covered files (40+ statements)</summary>

            **Backend**

            | File | Statements | Count |
            |---|---|---|
            ${rows(beLowest)}

            **Frontend**

            | File | Statements | Count |
            |---|---|---|
            ${rows(feLowest)}

            </details>

            _Commit ${context.sha.slice(0, 7)} · updated on every push to this PR._`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
